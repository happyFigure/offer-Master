[project]
name = "jobpilot-api"
version = "0.1.0"
description = "FastAPI backend for the local-first JobPilot agent."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "pydantic-settings>=2.10,<3.0",
  "SQLAlchemy>=2.0,<3.0",
  "pymysql>=1.1,<2.0",
  "alembic>=1.16,<2.0",
  "langgraph>=0.6,<1.0",
  "openai>=2.0,<4.0",
  "httpx>=0.27,<1.0",
  "beautifulsoup4>=4.12,<5.0",
  "crawl4ai>=0.7,<1.0",
  "lxml>=5.2,<7.0",
  "playwright>=1.50,<2.0",
  "readability-lxml>=0.8,<1.0",
  "trafilatura>=1.12,<3.0"
]

[project.optional-dependencies]
dev = []

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

worker_processes 1;

pid F:/pythonProject/OfferMaster/runtime/nginx/nginx.pid;
error_log F:/pythonProject/OfferMaster/runtime/nginx/logs/error.log warn;

events {
    worker_connections 1024;
}

http {
    include F:/pythonProject/spring-ai-nginx/conf/mime.types;
    default_type application/octet-stream;

    access_log F:/pythonProject/OfferMaster/runtime/nginx/logs/access.log;
    client_body_temp_path F:/pythonProject/OfferMaster/runtime/nginx/client_body_temp;
    proxy_temp_path F:/pythonProject/OfferMaster/runtime/nginx/proxy_temp;
    fastcgi_temp_path F:/pythonProject/OfferMaster/runtime/nginx/fastcgi_temp;
    scgi_temp_path F:/pythonProject/OfferMaster/runtime/nginx/scgi_temp;
    uwsgi_temp_path F:/pythonProject/OfferMaster/runtime/nginx/uwsgi_temp;

    sendfile on;
    keepalive_timeout 65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 5173;
        server_name 127.0.0.1 localhost;

        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://127.0.0.1:5174;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
